# The relay: one Cloudflare Worker that lets a visitor read a page with no key of
# their own. See src/relay/worker.ts. The site owner's key is a secret, set once
# with `npm run relay:secret`; it appears nowhere in this file or in code.

name = "dayeighty-relay"
main = "src/relay/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Origins the relay will answer. Anything else gets a 403 before a byte is read.
ALLOWED_ORIGINS = "https://scottdelia.github.io,http://localhost:5184,http://localhost:5185"

# Rate limits, so a demo cannot become a bill. Periods are seconds.
[[unsafe.bindings]]
name = "PER_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[unsafe.bindings]]
name = "GLOBAL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
